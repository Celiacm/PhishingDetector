<!DOCTYPE html>
<html>
<head>
    <title>Historial de Correos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>📜 Historial de Correos Analizados</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Asunto</th>
                    <th>Remitente</th>
                    <th>Estado</th>
                    <th>SPF</th>
                    <th>DKIM</th>
                    <th>DMARC</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
                {% for correo in correos %}
                <tr>
                    <td>{{ correo[1] }}</td>
                    <td>{{ correo[2] }}</td>
                    <td>{{ correo[3] }}</td>
                    <td>{{ correo[4] }}</td>
                    <td>{{ correo[5] }}</td>
                    <td>{{ correo[6] }}</td>
                    <td>{{ correo[7] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
